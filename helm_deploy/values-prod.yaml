---
# Per environment values which override defaults in hmpps-prisoner-finance-ui/values.yaml

generic-service:
  ingress:
    host: prisoner-finance.hmpps.service.justice.gov.uk

  env:
    INGRESS_URL: "https://prisoner-finance.hmpps.service.justice.gov.uk"
    HMPPS_AUTH_URL: "https://sign-in.hmpps.service.justice.gov.uk/auth"
    TOKEN_VERIFICATION_API_URL: "https://token-verification-api.prison.service.justice.gov.uk"
    COMPONENT_API_URL: "https://frontend-components.hmpps.service.justice.gov.uk"
    PRISONER_FINANCE_API_URL: "https://prisoner-finance-api.hmpps.service.justice.gov.uk"
    DPS_HOME_PAGE_URL: "https://digital.prison.service.justice.gov.uk"
    PRISONER_SEARCH_API_URL: "https://prisoner-search.prison.service.justice.gov.uk"
    PRISON_API_URL: "https://prison-api.prison.service.justice.gov.uk"
    PRISONER_PROFILE_URL: "https://prisoner.digital.prison.service.justice.gov.uk"
    PRISON_REGISTER_API_URL: "https://prison-register.hmpps.service.justice.gov.uk"
    INCENTIVES_UI_URL: "https://incentives-ui.hmpps.service.justice.gov.uk/incentive-reviews/prisoner"
    CATEGORIZATION_DASHBOARD_URL: "https://offender-categorisation.service.justice.gov.uk/landing"

    AUDIT_ENABLED: "true"
    FEATURE_TOGGLE_URL: "https://feature-toggles.hmpps.service.justice.gov.uk/"

  allowlist:
    groups:
    - digital_staff_and_mojo
    - prisons
    - private_prisons
    - moj_cloud_platform

generic-prometheus-alerts:
  alertSeverity: hmpps-prisoner-finance-ui-prod
